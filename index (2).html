<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ilha dos Dragões 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
    #game-container { width: 100vw; height: 100vh; position: relative; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; color: #fff; text-shadow: 0 1px 4px #000;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.85);
      border-radius: 50%;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255,255,255,0.85);
    }
    #crosshair::before { width: 2px; height: 7px; left: 8px; top: -9px; }
    #crosshair::after { width: 7px; height: 2px; top: 8px; left: -9px; }
    #ammo {
      position: absolute; bottom: 28px; right: 28px;
      font-size: 26px; font-weight: 700; letter-spacing: 1px;
    }
    #health-bar {
      position: absolute; bottom: 28px; left: 28px;
      width: 220px; height: 20px; background: rgba(0,0,0,0.55);
      border: 2px solid #fff; border-radius: 5px; overflow: hidden;
    }
    #health-fill {
      height: 100%; width: 100%; background: linear-gradient(90deg, #e74c3c, #c0392b);
      transition: width 0.25s;
    }
    #top-bar {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 28px; font-size: 18px; font-weight: 600;
      background: rgba(0,0,0,0.5); padding: 8px 22px; border-radius: 10px;
    }
    #wave-info { color: #7bed9f; }
    #coins { color: #f1c40f; }
    #kills { color: #ff6b6b; }
    #message {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 30px; font-weight: bold; text-align: center;
      background: rgba(0,0,0,0.75); padding: 24px 40px; border-radius: 14px;
      display: none; pointer-events: auto; cursor: pointer; max-width: 90vw;
    }
    #instructions {
      position: absolute; top: 70px; left: 18px; font-size: 13px;
      background: rgba(0,0,0,0.55); padding: 10px 14px; border-radius: 8px;
      line-height: 1.55; max-width: 240px;
    }
    #kill-feed {
      position: absolute; top: 70px; right: 18px; text-align: right;
      font-size: 13px; max-width: 260px;
    }
    .kill-item { margin-bottom: 3px; opacity: 0.95; animation: fadeOut 2.8s forwards; }
    @keyframes fadeOut { 0%{opacity:1} 65%{opacity:1} 100%{opacity:0} }

    /* LOJA */
    #shop {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.82); pointer-events: auto;
      justify-content: center; align-items: center; flex-direction: column; z-index: 20;
    }
    #shop.open { display: flex; }
    #shop h2 { font-size: 32px; margin-bottom: 6px; color: #f1c40f; }
    #shop .sub { font-size: 15px; color: #aaa; margin-bottom: 22px; }
    #shop-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px; max-width: 780px; width: 92%;
    }
    .shop-item {
      background: rgba(30,30,40,0.95); border: 2px solid #444; border-radius: 12px;
      padding: 16px; cursor: pointer; transition: all 0.15s; text-align: center;
    }
    .shop-item:hover { border-color: #f1c40f; transform: translateY(-3px); }
    .shop-item.disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }
    .shop-item .icon { font-size: 28px; margin-bottom: 6px; }
    .shop-item .name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .shop-item .desc { font-size: 12px; color: #bbb; margin-bottom: 8px; }
    .shop-item .price { font-size: 15px; color: #f1c40f; font-weight: 600; }
    #shop-next {
      margin-top: 26px; padding: 14px 36px; font-size: 18px; font-weight: 700;
      background: linear-gradient(135deg, #27ae60, #2ecc71); border: none; border-radius: 10px;
      color: #fff; cursor: pointer; box-shadow: 0 4px 15px rgba(46,204,113,0.4);
    }
    #shop-next:hover { filter: brightness(1.1); }
    #shop-coins { font-size: 20px; color: #f1c40f; margin-bottom: 10px; }

    #boss-bar-wrap {
      display: none; position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
      width: min(420px, 80vw); text-align: center;
    }
    #boss-bar-wrap.show { display: block; }
    #boss-name { font-size: 14px; font-weight: 700; color: #ff6b6b; margin-bottom: 4px; }
    #boss-bar {
      height: 14px; background: rgba(0,0,0,0.6); border: 2px solid #ff6b6b;
      border-radius: 4px; overflow: hidden;
    }
    #boss-fill {
      height: 100%; width: 100%; background: linear-gradient(90deg, #c0392b, #e74c3c);
      transition: width 0.2s;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <div id="crosshair"></div>
      <div id="ammo">30 / 30</div>
      <div id="health-bar"><div id="health-fill"></div></div>
      <div id="top-bar">
        <span id="wave-info">Onda 1</span>
        <span id="coins">💰 0</span>
        <span id="kills">🐉 0</span>
      </div>
      <div id="boss-bar-wrap">
        <div id="boss-name">CHEFE</div>
        <div id="boss-bar"><div id="boss-fill"></div></div>
      </div>
      <div id="instructions">
        <b>WASD</b> mover · <b>Mouse</b> mirar<br>
        <b>Clique</b> atirar · <b>Espaço</b> pular<br>
        <b>R</b> recarregar · Clique para começar<br>
        <span style="color:#2ecc71">🏠 Cabana = área segura</span>
      </div>
      <div id="safe-label" style="display:none; position:absolute; bottom:60px; left:50%; transform:translateX(-50%);
        background:rgba(39,174,96,0.85); padding:8px 20px; border-radius:8px; font-weight:700; font-size:16px;">
        🛡️ ÁREA SEGURA
      </div>
      <div id="kill-feed"></div>
      <div id="message">Clique para jogar</div>
    </div>

    <!-- LOJA -->
    <div id="shop">
      <h2>🛒 Loja de Upgrades</h2>
      <div id="shop-coins">💰 0 moedas</div>
      <div class="sub">Escolha upgrades e avance para a próxima onda</div>
      <div id="shop-grid"></div>
      <button id="shop-next">Próxima Onda →</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

    // ===== CONFIG =====
    const ISLAND_SIZE = 120;
    const WATER_LEVEL = 0;
    const JUMP_FORCE = 10;
    const GRAVITY = 22;

    // Player stats (upgradable)
    let stats = {
      speed: 12,
      maxAmmo: 30,
      reloadTime: 1.4,
      damage: 34,
      fireRate: 0.12,
      maxHealth: 100,
      coinMult: 1,
      bulletSpeed: 85,
      pellets: 1,       // shotgun spread
      allyOwned: false
    };

    // Armas disponíveis
    const WEAPONS = [
      { id: 'pistol', name: 'Pistola', icon: '🔫', damage: 34, fireRate: 0.14, maxAmmo: 30, reload: 1.3, bulletSpeed: 90, pellets: 1, color: 0xffee55, owned: true },
      { id: 'shotgun', name: 'Espingarda', icon: '💥', damage: 22, fireRate: 0.55, maxAmmo: 8, reload: 1.8, bulletSpeed: 70, pellets: 6, color: 0xff8844, owned: false, price: 45 },
      { id: 'rifle', name: 'Fuzil', icon: '🎯', damage: 48, fireRate: 0.09, maxAmmo: 25, reload: 1.6, bulletSpeed: 110, pellets: 1, color: 0x88ff88, owned: false, price: 70 },
      { id: 'laser', name: 'Laser', icon: '🔴', damage: 28, fireRate: 0.06, maxAmmo: 50, reload: 1.2, bulletSpeed: 140, pellets: 1, color: 0xff2266, owned: false, price: 95 },
    ];
    let currentWeapon = WEAPONS[0];

    // ===== SCENE (gráficos melhorados) =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x6eb5e0);
    scene.fog = new THREE.FogExp2(0x8ecae6, 0.008);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 400);
    camera.position.set(0, 3, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.getElementById('game-container').prepend(renderer.domElement);

    // Céu gradiente simples (esfera)
    const skyGeo = new THREE.SphereGeometry(400, 32, 24);
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: {
        topColor: { value: new THREE.Color(0x1a6fb5) },
        midColor: { value: new THREE.Color(0x7ec8e8) },
        bottomColor: { value: new THREE.Color(0xd4eef7) }
      },
      vertexShader: `
        varying vec3 vWorldPos;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 topColor;
        uniform vec3 midColor;
        uniform vec3 bottomColor;
        varying vec3 vWorldPos;
        void main() {
          float h = normalize(vWorldPos).y;
          vec3 col = mix(bottomColor, midColor, smoothstep(-0.2, 0.25, h));
          col = mix(col, topColor, smoothstep(0.25, 0.85, h));
          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    scene.add(new THREE.Mesh(skyGeo, skyMat));

    // Luzes melhoradas
    const ambient = new THREE.AmbientLight(0xb8d4e8, 0.4);
    scene.add(ambient);
    const hemi = new THREE.HemisphereLight(0x87ceeb, 0x3d5c3a, 0.45);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfff0d0, 1.35);
    sun.position.set(50, 70, 35);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 180;
    sun.shadow.camera.left = -100;
    sun.shadow.camera.right = 100;
    sun.shadow.camera.top = 100;
    sun.shadow.camera.bottom = -100;
    sun.shadow.camera.far = 250;
    sun.shadow.bias = -0.0003;
    scene.add(sun);
    // Luz de preenchimento
    const fill = new THREE.DirectionalLight(0xa0c4e8, 0.35);
    fill.position.set(-30, 20, -40);
    scene.add(fill);

    // ===== ISLAND =====
    function createIsland() {
      const geo = new THREE.PlaneGeometry(ISLAND_SIZE * 2, ISLAND_SIZE * 2, 64, 64);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i);
        const dist = Math.sqrt(x * x + y * y);
        let h = 0;
        if (dist < ISLAND_SIZE * 0.9) {
          h = Math.sin(x * 0.15) * Math.cos(y * 0.12) * 2.2
            + Math.sin(x * 0.35 + 1) * 0.8
            + Math.cos(y * 0.28) * 0.6
            + (1 - dist / (ISLAND_SIZE * 0.9)) * 3.5;
          if (dist > ISLAND_SIZE * 0.7) h *= (ISLAND_SIZE * 0.9 - dist) / (ISLAND_SIZE * 0.2);
        }
        pos.setZ(i, Math.max(h, -0.5));
      }
      geo.computeVertexNormals();
      geo.rotateX(-Math.PI / 2);
      const mat = new THREE.MeshStandardMaterial({ color: 0x4a7c3f, roughness: 0.9, metalness: 0.05 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.receiveShadow = true;
      mesh.castShadow = true;
      scene.add(mesh);
      return mesh;
    }
    createIsland();

    const sand = new THREE.Mesh(
      new THREE.RingGeometry(ISLAND_SIZE * 0.80, ISLAND_SIZE * 1.15, 64).rotateX(-Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: 0xd4b483, roughness: 0.95 })
    );
    sand.position.y = 0.28;
    sand.receiveShadow = true;
    scene.add(sand);

    // ===== ÁGUA COM ONDAS =====
    const waterGeo = new THREE.PlaneGeometry(500, 500, 64, 64);
    const waterMat = new THREE.MeshStandardMaterial({
      color: 0x0e5a78,
      transparent: true,
      opacity: 0.88,
      roughness: 0.12,
      metalness: 0.45,
      flatShading: false
    });
    const water = new THREE.Mesh(waterGeo, waterMat);
    water.rotation.x = -Math.PI / 2;
    water.position.y = WATER_LEVEL - 0.2;
    scene.add(water);
    const waterPos = waterGeo.attributes.position;
    const waterBase = new Float32Array(waterPos.count * 3);
    for (let i = 0; i < waterPos.count; i++) {
      waterBase[i * 3] = waterPos.getX(i);
      waterBase[i * 3 + 1] = waterPos.getY(i);
      waterBase[i * 3 + 2] = waterPos.getZ(i);
    }

    // Trees (mais e com variedade)
    function createTree(x, z, type) {
      const g = new THREE.Group();
      const trunkH = type === 1 ? 5.5 : (type === 2 ? 3.2 : 4.0);
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.2 + type * 0.05, 0.3 + type * 0.08, trunkH, 6),
        new THREE.MeshStandardMaterial({ color: type === 2 ? 0x4a3728 : 0x5c3a21, roughness: 0.9 })
      );
      trunk.position.y = trunkH / 2; trunk.castShadow = true; g.add(trunk);

      if (type === 2) {
        // Coqueiro
        for (let i = 0; i < 5; i++) {
          const leaf = new THREE.Mesh(
            new THREE.BoxGeometry(0.15, 0.08, 2.8),
            new THREE.MeshStandardMaterial({ color: 0x2d8a3e, roughness: 0.8, side: THREE.DoubleSide })
          );
          leaf.position.set(0, trunkH + 0.1, 0);
          leaf.rotation.y = (i / 5) * Math.PI * 2;
          leaf.rotation.x = 0.5;
          leaf.castShadow = true; g.add(leaf);
        }
        // Coco
        const coco = new THREE.Mesh(new THREE.SphereGeometry(0.2, 6, 6), new THREE.MeshStandardMaterial({ color: 0x6b4423 }));
        coco.position.set(0.3, trunkH - 0.3, 0.2); g.add(coco);
      } else {
        const leafColor = type === 1 ? 0x1a5c2e : 0x2d6a3e;
        const l1 = new THREE.Mesh(new THREE.ConeGeometry(2.0 + type * 0.4, 3.5 + type, 7), new THREE.MeshStandardMaterial({ color: leafColor, roughness: 0.85 }));
        l1.position.y = trunkH + 0.8; l1.castShadow = true; g.add(l1);
        const l2 = new THREE.Mesh(new THREE.ConeGeometry(1.4 + type * 0.2, 2.5 + type * 0.5, 7), new THREE.MeshStandardMaterial({ color: 0x3a8a4e, roughness: 0.85 }));
        l2.position.y = trunkH + 2.2; l2.castShadow = true; g.add(l2);
        if (type === 1) {
          const l3 = new THREE.Mesh(new THREE.ConeGeometry(1.0, 2.0, 6), new THREE.MeshStandardMaterial({ color: 0x4aaa5e, roughness: 0.85 }));
          l3.position.y = trunkH + 3.5; l3.castShadow = true; g.add(l3);
        }
      }
      g.position.set(x, 0.8 + Math.sin(x * 0.12) * 0.8, z);
      scene.add(g);
      return g;
    }
    for (let i = 0; i < 75; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = 12 + Math.random() * (ISLAND_SIZE * 0.72);
      // Coqueiros mais perto da areia
      const type = r > ISLAND_SIZE * 0.7 ? 2 : (Math.random() > 0.6 ? 1 : 0);
      createTree(Math.cos(a) * r, Math.sin(a) * r, type);
    }

    // Rocks
    for (let i = 0; i < 35; i++) {
      const a = Math.random() * Math.PI * 2, r = 8 + Math.random() * (ISLAND_SIZE * 0.75);
      const rock = new THREE.Mesh(
        new THREE.DodecahedronGeometry(0.6 + Math.random() * 1.5, 0),
        new THREE.MeshStandardMaterial({ color: 0x6b6b6b, roughness: 0.95, flatShading: true })
      );
      rock.position.set(Math.cos(a) * r, 0.5, Math.sin(a) * r);
      rock.rotation.set(Math.random(), Math.random(), Math.random());
      rock.castShadow = true; rock.receiveShadow = true;
      scene.add(rock);
    }

    // ===== BICHOS PASSIVOS =====
    const passives = [];

    function createRabbit(x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 6), new THREE.MeshStandardMaterial({ color: 0xc4a882, roughness: 0.9 }));
      body.scale.set(1.2, 0.9, 1); body.castShadow = true; g.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 6), new THREE.MeshStandardMaterial({ color: 0xd4b892 }));
      head.position.set(0.22, 0.1, 0); g.add(head);
      // Orelhas
      [[0.15, 0.35, 0.08], [0.15, 0.35, -0.08]].forEach(p => {
        const ear = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.3, 5), new THREE.MeshStandardMaterial({ color: 0xc4a882 }));
        ear.position.set(...p); g.add(ear);
      });
      g.position.set(x, 0.3, z);
      g.userData = { type: 'rabbit', speed: 2.5 + Math.random(), phase: Math.random() * 10, homeX: x, homeZ: z };
      scene.add(g); passives.push(g);
    }

    function createBird(x, y, z) {
      const g = new THREE.Group();
      const colors = [0xe74c3c, 0xf39c12, 0x3498db, 0x2ecc71, 0x9b59b6];
      const col = colors[Math.floor(Math.random() * colors.length)];
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 5), new THREE.MeshStandardMaterial({ color: col, roughness: 0.7 }));
      body.scale.set(1.3, 0.9, 1); g.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 5), new THREE.MeshStandardMaterial({ color: col }));
      head.position.set(0.12, 0.04, 0); g.add(head);
      const beak = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.1, 4), new THREE.MeshStandardMaterial({ color: 0xf1c40f }));
      beak.rotation.z = -Math.PI / 2; beak.position.set(0.2, 0.03, 0); g.add(beak);
      // Asas
      const wingL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.03, 0.12), new THREE.MeshStandardMaterial({ color: col }));
      wingL.position.set(0, 0.02, 0.12); g.add(wingL);
      const wingR = wingL.clone(); wingR.position.z = -0.12; g.add(wingR);
      g.position.set(x, y, z);
      g.userData = { type: 'bird', speed: 4 + Math.random() * 3, phase: Math.random() * 20, wingL, wingR, centerX: x, centerZ: z, height: y };
      scene.add(g); passives.push(g);
    }

    function createDeer(x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.7, 4, 8), new THREE.MeshStandardMaterial({ color: 0x8b6914, roughness: 0.85 }));
      body.rotation.z = Math.PI / 2; body.position.y = 0.7; body.castShadow = true; g.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 6), new THREE.MeshStandardMaterial({ color: 0x9a7b2e }));
      head.position.set(0.55, 1.0, 0); g.add(head);
      // Chifres simples
      [[0.5, 1.25, 0.1], [0.5, 1.25, -0.1]].forEach(p => {
        const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.03, 0.35, 4), new THREE.MeshStandardMaterial({ color: 0x5c4030 }));
        ant.position.set(...p); g.add(ant);
      });
      // Pernas
      [[0.25, 0, 0.15], [0.25, 0, -0.15], [-0.25, 0, 0.15], [-0.25, 0, -0.15]].forEach(p => {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.55, 5), new THREE.MeshStandardMaterial({ color: 0x6b5020 }));
        leg.position.set(p[0], 0.28, p[2]); g.add(leg);
      });
      g.position.set(x, 0, z);
      g.userData = { type: 'deer', speed: 3 + Math.random(), phase: Math.random() * 15, homeX: x, homeZ: z };
      scene.add(g); passives.push(g);
    }

    function createCrab(x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 6), new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.7 }));
      body.scale.set(1.3, 0.6, 1.1); body.castShadow = true; g.add(body);
      // Pinças
      [[0.25, 0.05, 0.2], [0.25, 0.05, -0.2]].forEach(p => {
        const claw = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.06, 0.1), new THREE.MeshStandardMaterial({ color: 0xc0392b }));
        claw.position.set(...p); g.add(claw);
      });
      g.position.set(x, 0.15, z);
      g.userData = { type: 'crab', speed: 1.5 + Math.random(), phase: Math.random() * 10, homeX: x, homeZ: z };
      scene.add(g); passives.push(g);
    }

    function createButterfly(x, y, z) {
      const g = new THREE.Group();
      const colors = [0xff6b9d, 0xffd93d, 0x6bcbff, 0xc9a0ff];
      const col = colors[Math.floor(Math.random() * colors.length)];
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.15, 5), new THREE.MeshStandardMaterial({ color: 0x222222 }));
      body.rotation.z = Math.PI / 2; g.add(body);
      const wingL = new THREE.Mesh(new THREE.CircleGeometry(0.12, 8), new THREE.MeshStandardMaterial({ color: col, side: THREE.DoubleSide, transparent: true, opacity: 0.85 }));
      wingL.position.set(0, 0.02, 0.08); g.add(wingL);
      const wingR = wingL.clone(); wingR.position.z = -0.08; g.add(wingR);
      g.position.set(x, y, z);

    // ===== CABANA DE ÁREA SEGURA =====
    const SAFE_CENTER = new THREE.Vector3(8, 0, -6);

    function createCabin() {
      const cabin = new THREE.Group();
      const wood = new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.85, metalness: 0.05 });
      const darkWood = new THREE.MeshStandardMaterial({ color: 0x4a2f18, roughness: 0.9 });
      const roofMat = new THREE.MeshStandardMaterial({ color: 0x5c3317, roughness: 0.95 });

      // Piso
      const floor = new THREE.Mesh(new THREE.BoxGeometry(6.5, 0.25, 5.5), wood);
      floor.position.y = 0.15; floor.receiveShadow = true; cabin.add(floor);

      // Paredes

      frontL.position.set(-2.0, wallH / 2 + 0.2, 2.7); frontL.castShadow = true; cabin.add(frontL);
      const frontR = new THREE.Mesh(new THREE.BoxGeometry(2.2, wallH, 0.25), wood);
      frontR.position.set(2.0, wallH / 2 + 0.2, 2.7); frontR.castShadow = true; cabin.add(frontR);

      frontTop.position.set(0, wallH - 0.15, 2.7); frontTop.castShadow = true; cabin.add(frontTop);

      // Traseira
      const back = new THREE.Mesh(new THREE.BoxGeometry(6.5, wallH, 0.25), wood);
      back.position.set(0, wallH / 2 + 0.2, -2.7); back.castShadow = true; cabin.add(back);

      // Laterais
      const sideL = new THREE.Mesh(new THREE.BoxGeometry(0.25, wallH, 5.5), wood);
      sideL.position.set(-3.2, wallH / 2 + 0.2, 0); sideL.castShadow = true; cabin.add(sideL);
      const sideR = new THREE.Mesh(new THREE.BoxGeometry(0.25, wallH, 5.5), wood);
      sideR.position.set(3.2, wallH / 2 + 0.2, 0); sideR.castShadow = true; cabin.add(sideR);

      // Telhado (duas águas)
      const roofL = new THREE.Mesh(new THREE.BoxGeometry(7.2, 0.2, 4.2), roofMat);
      roofL.position.set(0, wallH + 1.1, 1.1); roofL.rotation.x = -0.45; roofL.castShadow = true; cabin.add(roofL);
      const roofR = new THREE.Mesh(new THREE.BoxGeometry(7.2, 0.2, 4.2), roofMat);
      roofR.position.set(0, wallH + 1.1, -1.1); roofR.rotation.x = 0.45; roofR.castShadow = true; cabin.add(roofR);

      // Chaminé
      const chim = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.6, 0.7), darkWood);
      chim.position.set(2.0, wallH + 1.8, -0.8); chim.castShadow = true; cabin.add(chim);

      // Janelas (vidro simples)
      const glass = new THREE.MeshStandardMaterial({ color: 0x88ccee, transparent: true, opacity: 0.45, metalness: 0.3 });
      const win1 = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.0, 0.08), glass);
      win1.position.set(-3.25, 1.8, 0.8); cabin.add(win1);
      const win2 = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.0, 0.08), glass);

      // Anel de chão da zona segura (visual)

      );

      );

      cabin.position.copy(SAFE_CENTER);

    createCabin();

    // ===== PLAYER & ARMA =====
    const controls = new PointerLockControls(camera, document.body);

    const weaponGroup = new THREE.Group();

    // ===== STATE =====
    let velocity = new THREE.Vector3();

    let isReloading = false;
    let health = stats.maxHealth;

    let lastShot = 0;

    // ===== DRAGÃO MAIS REALISTA =====
    function createDragon(isBoss = false) {
      const group = new THREE.Group();
      const scale = isBoss ? 3.4 : (1.35 + Math.random() * 0.5);
      const hue = isBoss ? 0.72 : (0.0 + Math.random() * 0.12);
      const sat = isBoss ? 0.65 : 0.7;
      const lit = isBoss ? 0.22 : 0.32;

      const bodyMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(hue, sat, lit),
        roughness: 0.55, metalness: 0.25
      });
      const bellyMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(hue, sat * 0.5, lit + 0.18),
        roughness: 0.7, metalness: 0.1
      });
      const wingMat = new THREE.MeshStandardMaterial({
        color: isBoss ? 0x1a0a2e : new THREE.Color().setHSL(hue, 0.5, 0.18),
        side: THREE.DoubleSide, roughness: 0.65, metalness: 0.15,
        transparent: true, opacity: 0.94
      });
      const hornMat = new THREE.MeshStandardMaterial({ color: 0x1a1208, roughness: 0.75, metalness: 0.3 });
      const clawMat = new THREE.MeshStandardMaterial({ color: 0x222211, roughness: 0.4, metalness: 0.5 });

      // --- Corpo segmentado (mais orgânico) ---
      const chest = new THREE.Mesh(new THREE.SphereGeometry(0.7, 12, 10), bodyMat);
      chest.scale.set(1.3, 0.9, 1.0); chest.position.set(0.3, 0, 0); chest.castShadow = true; group.add(chest);

      const mid = new THREE.Mesh(new THREE.SphereGeometry(0.55, 10, 8), bodyMat);
      mid.scale.set(1.4, 0.75, 0.9); mid.position.set(-0.7, -0.05, 0); mid.castShadow = true; group.add(mid);

      const belly = new THREE.Mesh(new THREE.SphereGeometry(0.5, 10, 8), bellyMat);
      belly.scale.set(1.5, 0.55, 0.8); belly.position.set(0.1, -0.35, 0); group.add(belly);

      // --- Cabeça ---
      const headG = new THREE.Group();
      const skull = new THREE.Mesh(new THREE.SphereGeometry(0.42, 10, 8), bodyMat);
      skull.scale.set(1.35, 0.9, 0.95); skull.position.set(0, 0.05, 0); skull.castShadow = true; headG.add(skull);

      const snout = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.7, 7), bodyMat);
      snout.rotation.z = -Math.PI / 2; snout.position.set(0.55, -0.05, 0); snout.castShadow = true; headG.add(snout);

      const jaw = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.12, 0.28), bellyMat);
      jaw.position.set(0.4, -0.22, 0); headG.add(jaw);

      // Dentes
      for (let i = 0; i < 4; i++) {
        const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.12, 4), new THREE.MeshStandardMaterial({ color: 0xeeeeee }));
        tooth.position.set(0.35 + i * 0.08, -0.18, (i % 2 === 0 ? 0.08 : -0.08));
        tooth.rotation.x = Math.PI; headG.add(tooth);
      }

      // Olhos brilhantes
      const eyeMat = new THREE.MeshStandardMaterial({
        color: isBoss ? 0x00ffff : 0xffdd00, emissive: isBoss ? 0x004444 : 0x664400, emissiveIntensity: 0.8, roughness: 0.2
      });
      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), eyeMat);
      eyeL.position.set(0.35, 0.18, 0.28); headG.add(eyeL);
      const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), eyeMat);
      eyeR.position.set(0.35, 0.18, -0.28); headG.add(eyeR);
      // Pupila
      const pupilMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
      [[0.42, 0.18, 0.32], [0.42, 0.18, -0.32]].forEach(p => {
        const pu = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 6), pupilMat);
        pu.position.set(...p); headG.add(pu);
      });

      // Chifres
      const hornL = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.65, 6), hornMat);
      hornL.position.set(0.05, 0.45, 0.18); hornL.rotation.z = -0.5; hornL.rotation.x = -0.2; headG.add(hornL);
      const hornR = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.65, 6), hornMat);
      hornR.position.set(0.05, 0.45, -0.18); hornR.rotation.z = -0.5; hornR.rotation.x = 0.2; headG.add(hornR);
      if (isBoss) {
        const hornC = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.85, 6), new THREE.MeshStandardMaterial({ color: 0x9b59b6, metalness: 0.6, roughness: 0.3 }));
        hornC.position.set(-0.1, 0.55, 0); hornC.rotation.z = -0.3; headG.add(hornC);
      }

      headG.position.set(1.35, 0.15, 0);
      group.add(headG);

      // --- Asas detalhadas ---
      function makeWing(side) {
        const wg = new THREE.Group();
        // Osso principal
        const bone = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 2.4, 5), hornMat);
        bone.rotation.z = Math.PI / 2; bone.position.set(0.9, 0, 0); wg.add(bone);
        // Membrana
        const shape = new THREE.Shape();
        shape.moveTo(0, 0);
        shape.quadraticCurveTo(0.4, 1.6, 1.2, 2.5);
        shape.quadraticCurveTo(2.0, 2.8, 2.8, 1.8);
        shape.quadraticCurveTo(2.5, 0.8, 2.0, 0.2);
        shape.lineTo(0.3, -0.1);
        shape.lineTo(0, 0);
        const membrane = new THREE.Mesh(new THREE.ShapeGeometry(shape), wingMat);
        membrane.castShadow = true; wg.add(membrane);
        // Dedos da asa
        for (let i = 0; i < 3; i++) {
          const finger = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.015, 1.5 + i * 0.3, 4), hornMat);
          finger.position.set(0.5 + i * 0.55, 0.8 + i * 0.35, 0.02);
          finger.rotation.z = -0.6 - i * 0.15;
          wg.add(finger);
        }
        wg.position.set(-0.2, 0.35, side * 0.55);
        wg.rotation.y = side * 0.25;
        return wg;
      }
      const wingL = makeWing(1);
      const wingR = makeWing(-1);
      wingR.scale.z = -1;
      group.add(wingL);
      group.add(wingR);

      // --- Cauda segmentada ---
      const tailG = new THREE.Group();
      for (let i = 0; i < 5; i++) {
        const seg = new THREE.Mesh(
          new THREE.SphereGeometry(0.28 - i * 0.04, 8, 6),
          bodyMat
        );
        seg.scale.set(1.3, 0.7, 0.7);
        seg.position.set(-i * 0.45, -0.05 * i, 0);
        seg.castShadow = true;
        tailG.add(seg);
      }
      // Espinho na ponta
      const tip = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.5, 5), hornMat);
      tip.rotation.z = Math.PI / 2; tip.position.set(-2.4, -0.2, 0); tailG.add(tip);
      tailG.position.set(-1.3, -0.1, 0);
      group.add(tailG);

      // --- Pernas / garras ---
      function makeLeg(x, z) {
        const leg = new THREE.Group();
        const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.55, 5), bodyMat);
        thigh.position.y = -0.3; thigh.castShadow = true; leg.add(thigh);
        const foot = new THREE.Mesh(new THREE.SphereGeometry(0.14, 6, 5), clawMat);
        foot.scale.set(1.3, 0.6, 1.1); foot.position.y = -0.55; leg.add(foot);
        leg.position.set(x, -0.4, z);
        return leg;
      }
      group.add(makeLeg(0.5, 0.35));
      group.add(makeLeg(0.5, -0.35));
      group.add(makeLeg(-0.5, 0.3));
      group.add(makeLeg(-0.5, -0.3));

      // Espinhos no dorso
      for (let i = 0; i < 6; i++) {
        const spike = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.3 + (i % 2) * 0.1, 5), hornMat);
        spike.position.set(0.6 - i * 0.35, 0.55, 0);
        spike.rotation.z = -0.2;
        group.add(spike);
      }

      group.scale.setScalar(scale);

      const angle = Math.random() * Math.PI * 2;
      const r = 45 + Math.random() * 40;
      const flyH = isBoss ? 14 + Math.random() * 5 : 7 + Math.random() * 10;
      group.position.set(Math.cos(angle) * r, flyH, Math.sin(angle) * r);

      // Mais rápidos
      const baseHp = isBoss ? 900 + wave * 140 : 90 + wave * 22;
      group.userData = {
        health: baseHp,
        maxHealth: baseHp,
        speed: isBoss ? 9.5 : (7.2 + wave * 0.35 + Math.random() * 1.5),
        wingPhase: Math.random() * Math.PI * 2,
        wingL, wingR,
        tailG,
        headG,
        isBoss,
        coins: isBoss ? 50 + wave * 10 : 6 + Math.floor(wave * 1.5)
      };
      scene.add(group);
      enemies.push(group);
      if (isBoss) {
        currentBoss = group;
        document.getElementById('boss-bar-wrap').classList.add('show');
        document.getElementById('boss-name').textContent = wave % 5 === 0 ? '🐉 REI DRAGÃO' : '🔥 DRAGÃO CHEFE';
        updateBossBar();
      }
      return group;
    }

    // ===== ONDAS =====
    function startWave() {
      wave++;
      waveActive = true;
      shopOpen = false;
      document.getElementById('shop').classList.remove('open');
      document.getElementById('wave-info').textContent = `Onda ${wave}`;
      document.getElementById('message').style.display = 'block';
      document.getElementById('message').textContent = `🌊 ONDA ${wave}`;
      document.getElementById('message').style.pointerEvents = 'none';
      setTimeout(() => {
        if (!gameOver) document.getElementById('message').style.display = 'none';
      }, 1800);

      const isBossWave = wave % 3 === 0;
      const normalCount = 4 + Math.floor(wave * 1.8) + Math.floor(wave / 2);

      enemiesRemaining = normalCount + (isBossWave ? 1 : 0);

      // Spawn staggered
      for (let i = 0; i < normalCount; i++) {
        setTimeout(() => {
          if (!gameOver && waveActive) createDragon(false);
        }, i * 600);
      }
      if (isBossWave) {
        setTimeout(() => {
          if (!gameOver && waveActive) {
            createDragon(true);
            addKillFeed('⚠️ CHEFE APARECEU!');
          }
        }, normalCount * 400 + 800);
      }
    }

    function checkWaveEnd() {
      if (!waveActive || enemies.length > 0) return;
      waveActive = false;
      currentBoss = null;
      document.getElementById('boss-bar-wrap').classList.remove('show');
      // Heal a bit between waves
      health = Math.min(stats.maxHealth, health + 25);
      updateHUD();
      setTimeout(() => openShop(), 900);
    }

    // ===== LOJA =====
    const upgrades = [
      { id: 'damage', name: 'Dano +', icon: '💥', desc: '+12 de dano por tiro', price: 25, apply: () => { stats.damage += 12; currentWeapon.damage += 12; } },
      { id: 'firerate', name: 'Cadência +', icon: '⚡', desc: 'Atira mais rápido', price: 30, apply: () => { stats.fireRate = Math.max(0.04, stats.fireRate - 0.015); currentWeapon.fireRate = Math.max(0.04, currentWeapon.fireRate - 0.015); } },
      { id: 'ammo', name: 'Pente +', icon: '📦', desc: '+10 munição máxima', price: 20, apply: () => { stats.maxAmmo += 10; currentWeapon.maxAmmo += 10; ammo = stats.maxAmmo; } },
      { id: 'reload', name: 'Recarga Rápida', icon: '🔄', desc: 'Recarrega 20% mais rápido', price: 22, apply: () => { stats.reloadTime *= 0.8; currentWeapon.reload *= 0.8; } },
      { id: 'health', name: 'Vida Máx +', icon: '❤️', desc: '+25 vida máxima + cura', price: 28, apply: () => { stats.maxHealth += 25; health = stats.maxHealth; } },
      { id: 'speed', name: 'Velocidade +', icon: '👟', desc: '+1.5 velocidade', price: 18, apply: () => { stats.speed += 1.5; } },
      { id: 'coins', name: 'Sorte de Ouro', icon: '✨', desc: '+20% moedas por kill', price: 35, apply: () => { stats.coinMult += 0.2; } },
      { id: 'heal', name: 'Poção de Cura', icon: '🧪', desc: 'Recupera 50 de vida', price: 15, apply: () => { health = Math.min(stats.maxHealth, health + 50); } },
    ];

    function equipWeapon(w) {
      currentWeapon = w;
      stats.damage = w.damage;
      stats.fireRate = w.fireRate;
      stats.maxAmmo = w.maxAmmo;
      stats.reloadTime = w.reload;
      stats.bulletSpeed = w.bulletSpeed;
      stats.pellets = w.pellets;
      ammo = w.maxAmmo;
      updateHUD();
    }

    function openShop() {
      shopOpen = true;
      controls.unlock();
      document.getElementById('shop').classList.add('open');
      document.getElementById('shop-coins').textContent = `💰 ${coins} moedas`;
      const grid = document.getElementById('shop-grid');
      grid.innerHTML = '';

      // Seção armas
      const armTitle = document.createElement('div');
      armTitle.style.cssText = 'grid-column:1/-1;font-size:18px;font-weight:700;color:#f1c40f;margin:4px 0 2px;';
      armTitle.textContent = '⚔️ Armas';
      grid.appendChild(armTitle);

      WEAPONS.forEach(w => {
        const el = document.createElement('div');
        const isCurrent = currentWeapon.id === w.id;
        const canBuy = !w.owned && coins >= (w.price || 0);
        const canEquip = w.owned && !isCurrent;
        el.className = 'shop-item' + ((!w.owned && !canBuy) ? ' disabled' : '');
        if (isCurrent) el.style.borderColor = '#2ecc71';
        let priceText = isCurrent ? '✓ Equipada' : (w.owned ? 'Equipar' : `💰 ${w.price}`);
        el.innerHTML = `
          <div class="icon">${w.icon}</div>
          <div class="name">${w.name}</div>
          <div class="desc">Dano ${w.damage} · Cadência ${(1/w.fireRate).toFixed(1)}/s · Munição ${w.maxAmmo}${w.pellets > 1 ? ' · Spread x' + w.pellets : ''}</div>
          <div class="price">${priceText}</div>
        `;
        el.onclick = () => {
          if (isCurrent) return;
          if (w.owned) {
            equipWeapon(w);
            openShop();
          } else if (canBuy) {
            coins -= w.price;
            w.owned = true;
            equipWeapon(w);
            updateHUD();
            openShop();
          }
        };
        grid.appendChild(el);
      });

      // Aliado
      const allyTitle = document.createElement('div');
      allyTitle.style.cssText = 'grid-column:1/-1;font-size:18px;font-weight:700;color:#f1c40f;margin:10px 0 2px;';
      allyTitle.textContent = '🤖 Aliado';
      grid.appendChild(allyTitle);

      const allyEl = document.createElement('div');
      const allyOwned = stats.allyOwned;
      const allyPrice = 60;
      allyEl.className = 'shop-item' + ((!allyOwned && coins < allyPrice) ? ' disabled' : '');
      if (allyOwned) allyEl.style.borderColor = '#2ecc71';
      allyEl.innerHTML = `
        <div class="icon">🤖</div>
        <div class="name">Drone Aliado</div>
        <div class="desc">Atira junto com você nos dragões (só quando você atira)</div>
        <div class="price">${allyOwned ? '✓ Ativo' : '💰 ' + allyPrice}</div>
      `;
      if (!allyOwned && coins >= allyPrice) {
        allyEl.onclick = () => {
          coins -= allyPrice;
          stats.allyOwned = true;
          spawnAlly();
          updateHUD();
          openShop();
        };
      }
      grid.appendChild(allyEl);

      // Upgrades
      const upTitle = document.createElement('div');
      upTitle.style.cssText = 'grid-column:1/-1;font-size:18px;font-weight:700;color:#f1c40f;margin:10px 0 2px;';
      upTitle.textContent = '📈 Upgrades';
      grid.appendChild(upTitle);

      upgrades.forEach(u => {
        const canBuy = coins >= u.price;
        const el = document.createElement('div');
        el.className = 'shop-item' + (canBuy ? '' : ' disabled');
        el.innerHTML = `
          <div class="icon">${u.icon}</div>
          <div class="name">${u.name}</div>
          <div class="desc">${u.desc}</div>
          <div class="price">💰 ${u.price}</div>
        `;
        if (canBuy) {
          el.onclick = () => {
            coins -= u.price;
            u.apply();
            u.price = Math.ceil(u.price * 1.35);
            updateHUD();
            openShop();
          };
        }
        grid.appendChild(el);
      });
    }

    document.getElementById('shop-next').onclick = () => {
      if (shopOpen) {
        document.getElementById('shop').classList.remove('open');
        shopOpen = false;
        controls.lock();
        startWave();
      }
    };

    // ===== ALIADO =====
    let ally = null;
    function spawnAlly() {
      if (ally) return;
      const g = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.SphereGeometry(0.35, 10, 8),
        new THREE.MeshStandardMaterial({ color: 0x3498db, metalness: 0.6, roughness: 0.3, emissive: 0x1a4a6e, emissiveIntensity: 0.3 })
      );
      body.castShadow = true; g.add(body);
      const eye = new THREE.Mesh(
        new THREE.SphereGeometry(0.12, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00aaaa, emissiveIntensity: 0.9 })
      );
      eye.position.set(0.25, 0.05, 0); g.add(eye);
      // Asas do drone
      const wingM = new THREE.MeshStandardMaterial({ color: 0x2980b9, metalness: 0.5, roughness: 0.4 });
      [[0, 0.15, 0.4], [0, 0.15, -0.4]].forEach((p, i) => {
        const w = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.04, 0.5), wingM);
        w.position.set(...p); g.add(w);
      });
      const light = new THREE.PointLight(0x00ccff, 0.6, 6);
      g.add(light);
      g.position.set(2, 4, 2);
      scene.add(g);
      ally = g;
      ally.userData = { phase: 0 };
    }

    function allyShoot() {
      if (!ally || !stats.allyOwned || enemies.length === 0) return;
      // Mira no dragão mais próximo da mira do jogador
      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir);
      let best = null, bestDot = -1;
      enemies.forEach(e => {
        const toE = new THREE.Vector3().subVectors(e.position, camera.position).normalize();
        const dot = camDir.dot(toE);
        if (dot > bestDot) { bestDot = dot; best = e; }
      });
      if (!best || bestDot < 0.3) return;

      const dir = new THREE.Vector3().subVectors(best.position, ally.position).normalize();
      const bullet = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 6, 6),
        new THREE.MeshBasicMaterial({ color: 0x00eeff })
      );
      bullet.position.copy(ally.position);
      bullet.userData = {
        velocity: dir.multiplyScalar(100),
        life: 2.0,
        damage: Math.floor(stats.damage * 0.55),
        fromAlly: true
      };
      scene.add(bullet);
      bullets.push(bullet);
    }

    // ===== TIRO =====
    function shoot() {
      if (!gameStarted || gameOver || shopOpen || isReloading || ammo <= 0) return;
      const now = performance.now() / 1000;
      if (now - lastShot < stats.fireRate) return;
      lastShot = now;
      ammo--;
      updateHUD();

      muzzleLight.intensity = 5;
      muzzleLight.color.setHex(currentWeapon.color);
      setTimeout(() => { muzzleLight.intensity = 0; }, 40);
      weaponGroup.position.z = 0.06;
      setTimeout(() => { weaponGroup.position.z = 0; }, 55);

      const baseDir = new THREE.Vector3();
      camera.getWorldDirection(baseDir);

      const pellets = stats.pellets || 1;
      for (let i = 0; i < pellets; i++) {
        const dir = baseDir.clone();
        if (pellets > 1) {
          dir.x += (Math.random() - 0.5) * 0.18;
          dir.y += (Math.random() - 0.5) * 0.12;
          dir.z += (Math.random() - 0.5) * 0.18;
          dir.normalize();
        }
        const bullet = new THREE.Mesh(
          new THREE.SphereGeometry(pellets > 1 ? 0.05 : 0.07, 6, 6),
          new THREE.MeshBasicMaterial({ color: currentWeapon.color })
        );
        bullet.position.copy(camera.position).add(dir.clone().multiplyScalar(1.3));
        bullet.userData = {
          velocity: dir.multiplyScalar(stats.bulletSpeed),
          life: 2.2,
          damage: stats.damage,
          fromAlly: false
        };
        scene.add(bullet);
        bullets.push(bullet);
      }

      // Aliado atira junto
      allyShoot();

      if (navigator.vibrate) navigator.vibrate(pellets > 1 ? 25 : 12);
    }

    function reload() {
      if (isReloading || ammo === stats.maxAmmo || gameOver || shopOpen) return;
      isReloading = true;
      document.getElementById('ammo').textContent = 'Recarregando...';
      setTimeout(() => {
        ammo = stats.maxAmmo;
        isReloading = false;
        updateHUD();
      }, stats.reloadTime * 1000);
    }

    function spawnHitParticles(pos, color = 0xff4422, count = 8) {
      for (let i = 0; i < count; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.07 + Math.random() * 0.06, 4, 4),
          new THREE.MeshBasicMaterial({ color })
        );
        p.position.copy(pos);
        p.userData = {
          vel: new THREE.Vector3((Math.random() - 0.5) * 7, Math.random() * 6 + 1, (Math.random() - 0.5) * 7),
          life: 0.5 + Math.random() * 0.5
        };
        scene.add(p);
        particles.push(p);
      }
    }

    // ===== HUD =====
    function updateHUD() {
      const wIcon = currentWeapon ? currentWeapon.icon : '🔫';
      document.getElementById('ammo').textContent = isReloading ? 'Recarregando...' : `${wIcon} ${ammo} / ${stats.maxAmmo}`;
      document.getElementById('health-fill').style.width = `${Math.max(0, (health / stats.maxHealth) * 100)}%`;
      document.getElementById('coins').textContent = `💰 ${coins}`;
      document.getElementById('kills').textContent = `🐉 ${kills}`;
      document.getElementById('wave-info').textContent = `Onda ${wave || 1}`;
    }

    function updateBossBar() {
      if (!currentBoss) return;
      const pct = Math.max(0, (currentBoss.userData.health / currentBoss.userData.maxHealth) * 100);
      document.getElementById('boss-fill').style.width = pct + '%';
    }

    function addKillFeed(text) {
      const feed = document.getElementById('kill-feed');
      const item = document.createElement('div');
      item.className = 'kill-item';
      item.textContent = text;
      feed.prepend(item);
      setTimeout(() => item.remove(), 2800);
    }

    // ===== INPUT =====
    document.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'KeyR') reload();
    });
    document.addEventListener('keyup', e => { keys[e.code] = false; });

    document.addEventListener('mousedown', e => {
      if (e.button === 0) {
        if (shopOpen) return;
        if (!gameStarted) {
          controls.lock();
        } else if (!gameOver) {
          shoot();
        }
      }
    });

    controls.addEventListener('lock', () => {
      if (shopOpen) { controls.unlock(); return; }
      gameStarted = true;
      document.getElementById('message').style.display = 'none';
      document.getElementById('instructions').style.opacity = '0.35';
      if (wave === 0) startWave();
    });
    controls.addEventListener('unlock', () => {
      if (!gameOver && !shopOpen) {
        document.getElementById('message').style.display = 'block';
        document.getElementById('message').textContent = 'Clique para continuar';
        document.getElementById('message').style.pointerEvents = 'auto';
      }
    });

    function getGroundHeight(x, z) {
      const dist = Math.sqrt(x * x + z * z);
      // Além da areia = água (cai)
      if (dist > ISLAND_SIZE * 1.12) return -2;

      // Faixa de areia (caminhável e plana)
      if (dist > ISLAND_SIZE * 0.82) {
        // Altura suave da areia, quase plana
        const sandH = 0.35 + Math.sin(x * 0.08) * 0.08 + Math.cos(z * 0.07) * 0.06;
        return sandH + 1.7;
      }

      // Interior da ilha (grama com relevo)
      let h = Math.sin(x * 0.15) * Math.cos(z * 0.12) * 2.2
        + Math.sin(x * 0.35 + 1) * 0.8
        + Math.cos(z * 0.28) * 0.6
        + (1 - dist / (ISLAND_SIZE * 0.9)) * 3.5;
      if (dist > ISLAND_SIZE * 0.7) {
        // Transição suave grama → areia
        const t = (dist - ISLAND_SIZE * 0.7) / (ISLAND_SIZE * 0.12);
        h = h * (1 - t) + 0.35 * t;
      }
      return Math.max(h, 0.2) + 1.7;
    }

    // ===== LOOP =====
    const clock = new THREE.Clock();
    let enemyAttackTimer = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = performance.now() / 1000;

      // Ondas na água (mais detalhadas)
      for (let i = 0; i < waterPos.count; i++) {
        const x = waterBase[i * 3];
        const y = waterBase[i * 3 + 1];
        const wave1 = Math.sin(x * 0.07 + t * 1.5) * 0.42;
        const wave2 = Math.sin(y * 0.055 + t * 1.2) * 0.32;
        const wave3 = Math.sin((x + y) * 0.04 + t * 0.95) * 0.22;
        const wave4 = Math.sin(x * 0.15 - y * 0.1 + t * 2.1) * 0.12;
        waterPos.setZ(i, wave1 + wave2 + wave3 + wave4);
      }
      waterPos.needsUpdate = true;
      waterGeo.computeVertexNormals();

      if (gameStarted && !gameOver && !shopOpen) {
        // Movimento
        const forward = new THREE.Vector3();
        const right = new THREE.Vector3();
        camera.getWorldDirection(forward);
        forward.y = 0; forward.normalize();
        right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

        const move = new THREE.Vector3();
        if (keys['KeyW']) move.add(forward);
        if (keys['KeyS']) move.sub(forward);
        if (keys['KeyA']) move.sub(right);
        if (keys['KeyD']) move.add(right);
        if (move.length() > 0) {
          move.normalize().multiplyScalar(stats.speed * dt);
          controls.getObject().position.add(move);
        }

        if (keys['Space'] && canJump) {
          velocity.y = JUMP_FORCE;
          canJump = false;
        }
        velocity.y -= GRAVITY * dt;
        controls.getObject().position.y += velocity.y * dt;

        const px = controls.getObject().position.x;
        const pz = controls.getObject().position.z;
        const groundY = getGroundHeight(px, pz);
        if (controls.getObject().position.y < groundY) {
          controls.getObject().position.y = groundY;
          velocity.y = 0;
          canJump = true;
        }
        if (controls.getObject().position.y < -1) health = 0;

        // Balas
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.position.add(b.userData.velocity.clone().multiplyScalar(dt));
          b.userData.life -= dt;
          if (b.userData.life <= 0) {
            scene.remove(b); bullets.splice(i, 1); continue;
          }
          for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            const hitR = e.userData.isBoss ? 4.5 : 2.4;
            if (b.position.distanceTo(e.position) < hitR) {
              e.userData.health -= (b.userData.damage || stats.damage);
              spawnHitParticles(b.position.clone(), b.userData.fromAlly ? 0x00eeff : (e.userData.isBoss ? 0xaa44ff : 0xff6622));
              scene.remove(b); bullets.splice(i, 1);
              if (e.userData.isBoss) updateBossBar();
              if (e.userData.health <= 0) {
                const reward = Math.floor(e.userData.coins * stats.coinMult);
                coins += reward;
                kills++;
                spawnHitParticles(e.position.clone(), 0xffaa00, 14);
                spawnHitParticles(e.position.clone().add(new THREE.Vector3(0, 1, 0)), 0xff4400, 10);
                if (e.userData.isBoss) {
                  addKillFeed(`👑 Chefe derrotado! +${reward}💰`);
                  currentBoss = null;
                  document.getElementById('boss-bar-wrap').classList.remove('show');
                } else {
                  addKillFeed(`🐉 Dragão +${reward}💰`);
                }
                scene.remove(e);
                enemies.splice(j, 1);
                enemiesRemaining--;
                updateHUD();
                checkWaveEnd();
              }
              break;
            }
          }
        }

        // Zona segura?
        const playerPos = controls.getObject().position;
        const inSafeZone = playerPos.distanceTo(
          new THREE.Vector3(SAFE_CENTER.x, playerPos.y, SAFE_CENTER.z)
        ) < SAFE_RADIUS;

        // Indicador + regeneração lenta na cabana
        const safeLabel = document.getElementById('safe-label');
        if (safeLabel) {
          safeLabel.style.display = inSafeZone ? 'block' : 'none';
        }
        if (inSafeZone && health < stats.maxHealth) {
          health = Math.min(stats.maxHealth, health + 8 * dt);
          updateHUD();
        }

        // IA dos dragões
        enemyAttackTimer += dt;
        enemies.forEach(e => {
          const toPlayer = new THREE.Vector3().subVectors(playerPos, e.position);
          const dist = toPlayer.length();
          const hDist = Math.sqrt(toPlayer.x ** 2 + toPlayer.z ** 2);

          e.userData.wingPhase += dt * (e.userData.isBoss ? 9 : 12);
          const flap = Math.sin(e.userData.wingPhase) * 0.55;
          const flap2 = Math.cos(e.userData.wingPhase * 0.5) * 0.12;
          if (e.userData.wingL) {
            e.userData.wingL.rotation.z = flap;
            e.userData.wingL.rotation.x = flap2;
            e.userData.wingR.rotation.z = -flap;
            e.userData.wingR.rotation.x = -flap2;
          }
          // Cauda balança
          if (e.userData.tailG) {
            e.userData.tailG.rotation.y = Math.sin(e.userData.wingPhase * 0.7) * 0.25;
            e.userData.tailG.rotation.x = Math.sin(e.userData.wingPhase * 0.5) * 0.1;
          }
          // Cabeça segue um pouco
          if (e.userData.headG) {
            e.userData.headG.rotation.y = Math.sin(e.userData.wingPhase * 0.3) * 0.08;
          }

          // Dragões não entram na área segura — contornam
          const eToSafe = new THREE.Vector3().subVectors(
            new THREE.Vector3(SAFE_CENTER.x, e.position.y, SAFE_CENTER.z),
            e.position
          );
          const distToSafe = Math.sqrt(eToSafe.x ** 2 + eToSafe.z ** 2);

          if (inSafeZone) {
            // Jogador está seguro: dragões orbitam a zona e não atacam
            if (distToSafe < SAFE_RADIUS + 6) {
              // Empurra para fora
              const push = eToSafe.clone().normalize().multiplyScalar(-1);
              e.position.add(push.multiplyScalar(e.userData.speed * 1.2 * dt));
            } else {
              // Circula ao redor
              const angle = Math.atan2(e.position.z - SAFE_CENTER.z, e.position.x - SAFE_CENTER.x);
              const orbit = angle + dt * 0.4;
              const orbitR = SAFE_RADIUS + 8 + Math.sin(e.userData.wingPhase) * 2;
              const targetX = SAFE_CENTER.x + Math.cos(orbit) * orbitR;
              const targetZ = SAFE_CENTER.z + Math.sin(orbit) * orbitR;
              const toOrbit = new THREE.Vector3(targetX - e.position.x, 0, targetZ - e.position.z).normalize();
              e.position.add(toOrbit.multiplyScalar(e.userData.speed * 0.7 * dt));
            }
            const desiredY = 8 + Math.sin(t * 1.1 + e.userData.wingPhase) * 3;
            e.position.y += (desiredY - e.position.y) * 1.2 * dt;
            e.lookAt(SAFE_CENTER.x, e.position.y, SAFE_CENTER.z);
          } else {
            // Comportamento normal de caça
            if (hDist > (e.userData.isBoss ? 5 : 3.2)) {
              const dir = toPlayer.clone().normalize();
              e.position.add(dir.multiplyScalar(e.userData.speed * dt));
              const desiredY = playerPos.y + (e.userData.isBoss ? 7 : 4) + Math.sin(t * 1.1 + e.userData.wingPhase) * (e.userData.isBoss ? 4 : 2.5);
              e.position.y += (desiredY - e.position.y) * 1.4 * dt;
              e.lookAt(playerPos.x, e.position.y, playerPos.z);
              e.rotation.x = 0;
              e.rotation.z = Math.sin(e.userData.wingPhase * 0.4) * 0.1;
            } else {
              const dive = toPlayer.clone().normalize();
              e.position.add(dive.multiplyScalar(e.userData.speed * 1.5 * dt));
              e.lookAt(playerPos);
            }

            // Ataque só fora da zona segura
            const atkRange = e.userData.isBoss ? 4.5 : 3.0;
            const atkDmg = e.userData.isBoss ? 18 : 10;
            if (dist < atkRange && enemyAttackTimer > (e.userData.isBoss ? 0.7 : 0.85)) {
              health -= atkDmg;
              updateHUD();
              enemyAttackTimer = 0;
              spawnHitParticles(playerPos.clone().add(new THREE.Vector3(0, 0.4, 0)), 0xff2200, 6);
              if (health <= 0) {
                gameOver = true;
                controls.unlock();
                document.getElementById('message').style.display = 'block';
                document.getElementById('message').innerHTML = `
                  Você foi derrotado!<br>
                  <span style="font-size:17px">Onda ${wave} · ${kills} dragões · ${coins}💰</span><br><br>
                  Clique para reiniciar
                `;
                document.getElementById('message').style.pointerEvents = 'auto';
                document.getElementById('message').onclick = () => location.reload();
              }
            }
          }

          // Evita que dragões invadam o círculo seguro
          if (distToSafe < SAFE_RADIUS + 1.5) {
            const pushOut = new THREE.Vector3(
              e.position.x - SAFE_CENTER.x, 0, e.position.z - SAFE_CENTER.z
            ).normalize().multiplyScalar(e.userData.speed * 2 * dt);
            e.position.add(pushOut);
          }

          const minY = getGroundHeight(e.position.x, e.position.z) + 2.5;
          if (e.position.y < minY) e.position.y = minY;
        });

        // Partículas
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.userData.vel.y -= 14 * dt;
          p.position.add(p.userData.vel.clone().multiplyScalar(dt));
          p.userData.life -= dt;
          p.scale.multiplyScalar(0.95);
          if (p.userData.life <= 0) {
            scene.remove(p); particles.splice(i, 1);
          }
        }

        // Bichos passivos
        passives.forEach(p => {
          const ud = p.userData;
          ud.phase += dt;
          if (ud.type === 'rabbit' || ud.type === 'deer' || ud.type === 'crab') {
            const wander = Math.sin(ud.phase * 0.4) * 8;
            const tx = ud.homeX + Math.cos(ud.phase * 0.3) * wander;
            const tz = ud.homeZ + Math.sin(ud.phase * 0.25) * wander;
            const dir = new THREE.Vector3(tx - p.position.x, 0, tz - p.position.z);
            if (dir.length() > 0.3) {
              dir.normalize();
              p.position.add(dir.multiplyScalar(ud.speed * dt));
              p.lookAt(p.position.x + dir.x, p.position.y, p.position.z + dir.z);
            }
            // Altura do chão
            const gh = getGroundHeight(p.position.x, p.position.z);
            p.position.y = (ud.type === 'crab' ? 0.15 : (ud.type === 'rabbit' ? 0.35 : 0.05)) + (gh - 1.7);
            // Foge um pouco do jogador se perto
            const toP = playerPos.distanceTo(p.position);
            if (toP < 5) {
              const away = new THREE.Vector3().subVectors(p.position, playerPos).normalize();
              p.position.add(away.multiplyScalar(ud.speed * 1.5 * dt));
            }
          } else if (ud.type === 'bird') {
            p.position.x = ud.centerX + Math.cos(ud.phase * 0.5) * 12;
            p.position.z = ud.centerZ + Math.sin(ud.phase * 0.4) * 12;
            p.position.y = ud.height + Math.sin(ud.phase * 1.2) * 2;
            if (ud.wingL) {
              ud.wingL.rotation.z = Math.sin(ud.phase * 12) * 0.6;
              ud.wingR.rotation.z = -Math.sin(ud.phase * 12) * 0.6;
            }
            p.lookAt(p.position.x + Math.cos(ud.phase * 0.5), p.position.y, p.position.z + Math.sin(ud.phase * 0.4));
          } else if (ud.type === 'butterfly') {
            p.position.x = ud.centerX + Math.sin(ud.phase * 0.8) * 4;
            p.position.z = ud.centerZ + Math.cos(ud.phase * 0.6) * 4;
            p.position.y = ud.height + Math.sin(ud.phase * 2) * 0.8;
            if (ud.wingL) {
              ud.wingL.rotation.y = Math.sin(ud.phase * 15) * 0.8;
              ud.wingR.rotation.y = -Math.sin(ud.phase * 15) * 0.8;
            }
          }
        });

        // Aliado segue o jogador
        if (ally && stats.allyOwned) {
          ally.userData.phase += dt * 3;
          const target = playerPos.clone().add(new THREE.Vector3(
            Math.cos(ally.userData.phase * 0.7) * 2.2,
            2.2 + Math.sin(ally.userData.phase) * 0.4,
            Math.sin(ally.userData.phase * 0.7) * 2.2
          ));
          ally.position.lerp(target, 4 * dt);
          ally.lookAt(playerPos.x, ally.position.y, playerPos.z);
        }

        // Bob da arma
        if (move.length() > 0.01) {
          const bob = t * 8;
          weaponGroup.position.y = Math.sin(bob) * 0.012;
          weaponGroup.position.x = Math.cos(bob * 0.5) * 0.007;
        } else {
          weaponGroup.position.y *= 0.88;
          weaponGroup.position.x *= 0.88;
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
